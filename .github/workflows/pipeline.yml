name: ML Model Validation and Deployment Pipeline

on:
  push:
    branches:
      - main
      - ci-test
  pull_request:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs (1-2 for failure, 10+ for success)"
        required: false
        default: "10"
        type: string

jobs:
  validate:
    name: Train and Validate Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull data with DVC
        run: |
          dvc init --force || true
          dvc pull || echo "DVC pull skipped (no remote configured)"
          echo "Data preparation complete"

      - name: Train model
        env:
          EPOCHS: ${{ github.event.inputs.epochs || '10' }}
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          echo "Training with $EPOCHS epochs..."
          python train.py

      - name: Verify MLflow outputs were created
        run: |
          test -f mlflow.db
          test -d mlruns

      - name: Verify model_info.txt was created
        run: |
          test -f model_info.txt
          RUN_ID=$(head -n 1 model_info.txt)
          echo "Run ID: $RUN_ID"
          echo "model_info.txt created successfully."

      - name: Upload model info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt
          retention-days: 5

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns/
            mlflow.db
          retention-days: 5
          include-hidden-files: true

  deploy:
    name: Check Threshold and Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow

      - name: Download model info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info

      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts
          path: .

      - name: Check accuracy threshold
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          ACCURACY_THRESHOLD: "0.85"
        run: python check_threshold.py

      - name: Mock Docker build
        if: success()
        run: |
          RUN_ID=$(head -n 1 model_info.txt)
          echo "=========================================="
          echo "Building Docker image for Run ID: $RUN_ID"
          echo "=========================================="
          echo "Command: docker build --build-arg RUN_ID=$RUN_ID -t mnist-model:$RUN_ID ."
          echo "Mock build successful."

      - name: Deployment summary
        if: success()
        run: |
          RUN_ID=$(head -n 1 model_info.txt)
          {
            echo "## Deployment Summary"
            echo ""
            echo "✅ **Model validated and ready for deployment**"
            echo ""
            echo "- **Run ID**: \`$RUN_ID\`"
            echo "- **Accuracy**: Passed threshold (≥ 85%)"
            echo "- **Docker Image**: \`mnist-model:$RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
